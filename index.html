<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAMBOO! 🎋</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #2d6a4f;
  --green-light: #52b788;
  --green-mid: #40916c;
  --gold: #f4a261;
  --gold-dark: #e76f51;
  --cream: #fefae0;
  --dark: #1b1b2f;
  --darker: #0d0d1a;
  --text-light: #f0ede8;
  --bamboo: #a8c686;
  --panel-bg: rgba(13,13,26,0.92);
}

body {
  min-height: 100vh;
  background: #0d1117;
  background-image:
    radial-gradient(ellipse 70% 50% at 20% 0%, rgba(45,106,79,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(82,183,136,0.1) 0%, transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 60px, rgba(255,255,255,0.015) 61px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 60px, rgba(255,255,255,0.015) 61px);
  color: var(--text-light);
  font-family: 'DM Mono', monospace;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 10px 20px;
  border-bottom: 1px solid rgba(82,183,136,0.2);
  background: rgba(13,17,23,0.9);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
  gap: 6px;
}
.header-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
}
.header-row.row-top { justify-content: space-between; }
.header-row.row-bot { justify-content: center; position: relative; }

.logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 2rem;
  letter-spacing: 0.08em;
  color: var(--bamboo);
  line-height: 1;
  white-space: nowrap;
  flex-shrink: 0;
}
.logo span { color: var(--gold); }

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: nowrap;
}

.control-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  white-space: nowrap;
}

select, input[type="number"] {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(82,183,136,0.3);
  border-radius: 6px;
  color: var(--text-light);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  padding: 6px 10px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
select:focus, input[type="number"]:focus { border-color: var(--green-light); }
input[type="number"] { width: 72px; }

.btn {
  padding: 7px 16px;
  border-radius: 6px;
  border: 1px solid rgba(82,183,136,0.4);
  background: rgba(82,183,136,0.12);
  color: var(--green-light);
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}
.btn:hover { background: rgba(82,183,136,0.25); border-color: var(--green-light); }
.btn.primary {
  background: var(--green-mid);
  border-color: var(--green-light);
  color: #fff;
}
.btn.primary:hover { background: var(--green-light); }

/* ── Word Grid ── */
.stage {
  flex: 1;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  padding: 16px 16px 72px;
  overflow: hidden;
  min-height: 0;
}

.word-grid {
  display: grid;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.word-card {
  background: rgba(255,255,255,0.04);
  border: 2px solid rgba(82,183,136,0.25);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
  overflow: hidden;
  user-select: none;
  min-height: 0;
}

.word-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(82,183,136,0.07) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.2s;
}

.word-card:hover {
  border-color: var(--green-light);
  background: rgba(82,183,136,0.08);
  transform: scale(1.02);
}
.word-card:hover::before { opacity: 1; }
.word-card:active { transform: scale(0.97); }

.word-text {
  font-family: 'Bebas Neue', cursive;
  letter-spacing: 0.04em;
  color: #fff;
  text-align: center;
  padding: 8px 12px;
  line-height: 1.05;
  text-shadow: 0 0 20px rgba(82,183,136,0.3);
  font-size: 5vw;
}

.word-num {
  position: absolute;
  top: 8px;
  left: 10px;
  font-family: 'Bebas Neue', cursive;
  font-size: 1.1rem;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
}

/* ── Detail View ── */
#detail-view {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(13,17,23,0.97);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 40px;
}

#detail-view.active { display: flex; }

.detail-en {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.detail-jp {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: clamp(3.5rem, 10vw, 8rem);
  color: var(--green-light);
  text-align: center;
  text-shadow: 0 0 40px rgba(82,183,136,0.25);
  line-height: 1.15;
}

.detail-back {
  margin-top: 48px;
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}

.back-arrow {
  width: 28px;
  height: 28px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.detail-num {
  position: fixed;
  top: 20px;
  right: 24px;
  font-size: 11px;
  color: rgba(255,255,255,0.18);
  letter-spacing: 0.1em;
}

/* ── Range filter UI ── */
.range-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.range-sep {
  color: rgba(255,255,255,0.25);
  font-size: 11px;
}

/* ── Color swatches ── */
.swatch {
  width: 18px; height: 18px;
  border-radius: 50%;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: transform 0.18s, border-color 0.18s;
  flex-shrink: 0;
}
.swatch:hover { transform: scale(1.25); }
.swatch.active { border-color: rgba(255,255,255,0.75); transform: scale(1.15); }
.swatch-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.12); }

/* ── Scoreboard bar ── */
#scoreboard {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  z-index: 200;
  display: flex;
  align-items: stretch;
  pointer-events: none;
}
/* dark dead zone fills the full bar behind everything */
#sb-bg {
  position: absolute;
  inset: 0;
  background: rgba(10,10,18,0.82);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.08);
}
/* bars are positioned absolutely from center */
.score-bar {
  position: absolute;
  top: 0; bottom: 0;
  display: flex;
  align-items: center;
  overflow: hidden;
  width: 0;
  transition: width 0.5s cubic-bezier(0.34,1.2,0.64,1);
}
/* A grows LEFT from center */
.score-bar.bar-a {
  right: 50%;
  justify-content: flex-end;
  padding-right: 16px;
}
/* B grows RIGHT from center */
.score-bar.bar-b {
  left: 50%;
  justify-content: flex-start;
  padding-left: 16px;
}
.score-inner { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.score-name {
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.85);
}
.score-num {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.8rem;
  line-height: 1;
  color: #fff;
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
/* center marker */
.score-mid {
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  transform: translateX(-50%);
  width: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  z-index: 2;
}
.score-mid-label {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.25);
  text-transform: uppercase;
}
.score-target {
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  color: rgba(255,255,255,0.4);
}

/* ── Team name inputs in header ── */
.team-inputs {
  display: flex;
  align-items: center;
  gap: 6px;
}
input.team-name {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(82,183,136,0.25);
  border-radius: 6px;
  color: rgba(255,255,255,0.7);
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  letter-spacing: 0.08em;
  padding: 5px 10px;
  width: 90px;
  outline: none;
  transition: border-color 0.2s;
}
input.team-name:focus { border-color: var(--green-light); color: #fff; }
.team-sep {
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  color: rgba(255,255,255,0.2);
}
.btn-reset-score {
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 5px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: rgba(255,255,255,0.25);
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
  transition: all 0.15s;
}
.btn-reset-score:hover { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.3); }

/* ── Point buttons on detail view ── */
.detail-score-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 40px;
}
.team-btns {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.team-btn-name {
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.5);
}
.team-btn-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.point-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  cursor: pointer;
  transition: all 0.18s;
  user-select: none;
  font-family: 'Bebas Neue', cursive;
  font-size: 1.8rem;
  color: #fff;
  line-height: 1;
}
.point-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); transform: scale(1.07); }
.point-btn:active { transform: scale(0.94); }
.point-btn.minus { font-size: 1.4rem; color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.03); }
.point-btn.minus:hover { color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.1); }
.detail-score-sep {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.1em;
}

/* ── Victory screen ── */
#victory-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 300;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#victory-screen.active { display: flex; }

.victory-bg {
  position: absolute;
  inset: 0;
  transition: background 0.6s ease;
}
.victory-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  padding: 40px;
}
.victory-label {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  opacity: 0.55;
  animation: vfadein 0.8s ease both;
}
.victory-name {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(5rem, 16vw, 12rem);
  line-height: 0.9;
  letter-spacing: 0.04em;
  animation: vslide 0.7s cubic-bezier(0.22,1,0.36,1) both;
}
.victory-sub {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(1.4rem, 4vw, 2.6rem);
  letter-spacing: 0.18em;
  opacity: 0.7;
  animation: vfadein 1s ease 0.3s both;
}
.victory-scores {
  font-family: 'DM Mono', monospace;
  font-size: 1rem;
  letter-spacing: 0.1em;
  opacity: 0.35;
  margin-top: 8px;
  animation: vfadein 1s ease 0.5s both;
}
.victory-tap {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.22;
  margin-top: 48px;
  animation: vpulse 2s ease 1s infinite;
}
/* Confetti particle */
.confetti {
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 2px;
  pointer-events: none;
  animation: cfall linear forwards;
}
/* Sudden death banner */
#sd-banner {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 250;
  background: #cc0000;
  padding: 8px 0;
  text-align: center;
  font-family: 'Bebas Neue', cursive;
  font-size: 1.3rem;
  letter-spacing: 0.2em;
  color: #fff;
  animation: sdpulse 1s ease infinite alternate;
}
#sd-banner.active { display: block; }

@keyframes vfadein { from { opacity:0; transform:translateY(12px); } to {} }
@keyframes vslide  { from { opacity:0; transform:translateY(40px) scale(0.85); } to {} }
@keyframes vpulse  { from { opacity:0.22; } to { opacity:0.5; } }
@keyframes cfall   {
  0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity:0; }
}
@keyframes sdpulse { from { letter-spacing:0.18em; } to { letter-spacing:0.28em; } }
@keyframes sdflashout { from { opacity:1; } to { opacity:0; } }

/* ── Splash screen ── */
#splash {
  position: fixed; inset: 0; z-index: 600;
  background: #0d0d0f;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; overflow: hidden;
}
#splash.hide { animation: splashOut 0.55s ease forwards; pointer-events: none; }
@keyframes splashOut { to { opacity:0; transform:scale(1.06); } }

.s-bg {
  position: absolute;
  font-size: clamp(100px, 22vw, 200px);
  opacity: 0.035; pointer-events: none; user-select: none;
  filter: blur(1px);
}
.s-bg:nth-child(1){top:2%;left:2%;  animation:sdrift 11s ease-in-out infinite alternate;}
.s-bg:nth-child(2){top:2%;right:2%; animation:sdrift 11s ease-in-out -4s infinite alternate;}
.s-bg:nth-child(3){bottom:2%;left:2%;  animation:sdrift 11s ease-in-out -7s infinite alternate;}
.s-bg:nth-child(4){bottom:2%;right:2%;animation:sdrift 11s ease-in-out -2s infinite alternate;}
@keyframes sdrift {
  from { transform: translateY(0) rotate(-10deg); }
  to   { transform: translateY(-28px) rotate(10deg); }
}

.s-content {
  position: relative; z-index: 1; text-align: center;
  animation: sIn .9s cubic-bezier(.34,1.56,.64,1) both;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
@keyframes sIn { from{transform:scale(.65);opacity:0;} to{transform:scale(1);opacity:1;} }

.s-emoji {
  font-size: clamp(72px,18vw,130px); line-height: 1; margin-bottom: 18px;
  filter: drop-shadow(0 0 40px rgba(168,198,134,0.7));
  animation: sEmojiPop .55s cubic-bezier(.34,1.56,.64,1) .12s both;
  display: block;
}
@keyframes sEmojiPop {
  from { transform:scale(0) rotateY(90deg); opacity:0; }
  to   { transform:scale(1) rotateY(0);    opacity:1; }
}

.s-title {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(52px, 14vw, 120px);
  letter-spacing: 0.1em; line-height: 0.95;
  color: #a8c686;
  text-shadow: 0 0 40px rgba(168,198,134,0.6), 0 0 80px rgba(168,198,134,0.2);
  margin-bottom: 4px;
}
.s-title span { color: #f4a261; }

.s-sub {
  font-family: 'DM Mono', monospace;
  font-size: clamp(9px, 2vw, 13px);
  letter-spacing: 0.32em; text-transform: uppercase;
  color: rgba(255,255,255,0.2); margin-bottom: 32px;
}

.s-line {
  width: min(280px, 70vw); height: 1px;
  background: linear-gradient(90deg, transparent, rgba(168,198,134,0.6), transparent);
  margin: 0 auto 30px;
}

.s-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
.s-dot {
  width: 10px; height: 10px; border-radius: 50%;
  animation: sDotPop .4s cubic-bezier(.34,1.56,.64,1) both;
}
.s-dot:nth-child(1){ background:#ff5600; animation-delay:.3s; }
.s-dot:nth-child(2){ background:#d43bff; animation-delay:.38s; }
.s-dot:nth-child(3){ background:#ff3892; animation-delay:.46s; }
.s-dot:nth-child(4){ background:#ffe000; animation-delay:.54s; }
.s-dot:nth-child(5){ background:#00d476; animation-delay:.62s; }
.s-dot:nth-child(6){ background:#ff7800; animation-delay:.70s; }
@keyframes sDotPop { from{transform:scale(0);opacity:0;} to{transform:scale(1);opacity:1;} }

.s-tap {
  font-family: 'DM Mono', monospace;
  font-size: clamp(9px, 1.8vw, 12px);
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(255,255,255,0.2);
  animation: sTapPulse 2s ease 1s infinite alternate;
}
@keyframes sTapPulse { from{opacity:0.2;} to{opacity:0.55;} }

.music-btn {
  padding: 6px 10px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.5); font-size: 14px;
  cursor: pointer; transition: all 0.18s; line-height: 1;
}
.music-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

.list-menu-item {
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem; letter-spacing: 0.08em;
  padding: 10px 16px; border-radius: 6px;
  border: 1px solid transparent;
  background: #1a1f2e; color: rgba(255,255,255,0.8);
  cursor: pointer; transition: all 0.15s; text-align: left; width: 100%;
}
.list-menu-item:hover { background: #252d40; color: #fff; border-color: rgba(82,183,136,0.4); }
.list-menu-item.active { background: rgba(82,183,136,0.25); border-color: var(--green-light); color: #fff; }
</style>
</head>
<body>

<div id="splash" onclick="dismissSplash()" style="position:fixed;inset:0;z-index:600;cursor:pointer;">
  <div class="s-bg" style="pointer-events:none">🎋</div>
  <div class="s-bg" style="pointer-events:none">🎋</div>
  <div class="s-bg" style="pointer-events:none">🎋</div>
  <div class="s-bg" style="pointer-events:none">🎋</div>
  <div class="s-content" style="pointer-events:none">
    <span class="s-emoji">🎋</span>
    <div class="s-title">BAM<span>BOO</span>!</div>
    <div class="s-sub">English Vocab Flyswatter Game</div>
    <div class="s-line"></div>
    <div class="s-dots">
      <div class="s-dot"></div>
      <div class="s-dot"></div>
      <div class="s-dot"></div>
      <div class="s-dot"></div>
      <div class="s-dot"></div>
      <div class="s-dot"></div>
    </div>
    <div class="s-tap">Tap anywhere to play</div>
  </div>
</div>


<div class="header" id="header">
  <div class="header-row row-top">
    <div class="logo">BAM<span>BOO</span>! 🎋</div>
    <div class="controls">
      <span class="control-label">Words</span>
      <input type="number" id="range-from" value="1" min="1" max="760" style="width:60px">
      <span class="range-sep">–</span>
      <input type="number" id="range-to" value="760" min="1" max="760" style="width:60px">
      <div class="swatch-divider"></div>
      <span class="control-label">Show</span>

  { bg:'#0e0e0e', glowA:'rgba(255,86,0,0.12)',   glowB:'rgba(10,133,224,0.12)', accent:'#aaaaaa', border:'rgba(200,200,200,0.15)', card:'rgba(255,255,255,0.04)', word:'#f0ede8', dark:false, tA:'#ff5600', tB:'#0a85e0' },
  // FOREST — purple vs green: deep cool-dark bg, purple+green glows, mid-green accent
  { bg:'#090b0e', glowA:'rgba(212,59,255,0.13)', glowB:'rgba(85,224,0,0.11)',   accent:'#7ecc44', border:'rgba(126,204,68,0.25)',  card:'rgba(255,255,255,0.04)', word:'#edf5e8', dark:false, tA:'#d43bff', tB:'#55e000' },
  // VIOLET — pink vs teal: very dark desaturated bg, pink+teal glows, teal accent
  { bg:'#090c0c', glowA:'rgba(255,56,146,0.13)', glowB:'rgba(0,200,160,0.11)',  accent:'#00c8a0', border:'rgba(0,200,160,0.25)',   card:'rgba(255,255,255,0.04)', word:'#f0ede8', dark:false, tA:'#ff3892', tB:'#00c8a0' },
  // EMBER — yellow vs purple: warm very dark bg, yellow+purple glows, golden accent
  { bg:'#0f0d08', glowA:'rgba(255,224,0,0.13)',  glowB:'rgba(123,0,212,0.12)',  accent:'#e8c000', border:'rgba(232,192,0,0.28)',   card:'rgba(255,255,255,0.04)', word:'#f5f0e0', dark:false, tA:'#ffe000', tB:'#7b00d4' },
  // OCEAN — green vs pink: deep blue-tinted dark bg, green+pink glows, seafoam accent
  { bg:'#060d0f', glowA:'rgba(0,212,118,0.13)',  glowB:'rgba(255,77,171,0.12)', accent:'#00d476', border:'rgba(0,212,118,0.25)',   card:'rgba(255,255,255,0.04)', word:'#e8f5f0', dark:false, tA:'#00d476', tB:'#ff4dab' },
  // AMBER — orange vs cyan: warm dark brown bg, orange+cyan glows, amber accent
  { bg:'#0f0b06', glowA:'rgba(255,120,0,0.14)',  glowB:'rgba(0,170,255,0.12)',  accent:'#ff7800', border:'rgba(255,120,0,0.28)',   card:'rgba(255,255,255,0.04)', word:'#f5f0e8', dark:false, tA:'#ff7800', tB:'#00aaff' },
  // PAPER — black vs white: light warm bg, very subtle glows, dark ink accent
  { bg:'#f0ede8', glowA:'rgba(0,0,0,0.04)',      glowB:'rgba(0,0,0,0.03)',      accent:'#222222', border:'rgba(0,0,0,0.15)',       card:'rgba(0,0,0,0.03)',       word:'#1a1a1f', dark:true,  tA:'#111111', tB:'#f5f5f5' },
];
let activeTheme = 0;

function setTheme(i) {
  activeTheme = i;
  preSuddenDeathTheme = i;
  const t = THEMES[i];
  document.body.style.background = t.bg;
  document.body.style.backgroundImage = `
    radial-gradient(ellipse 70% 50% at 20% 0%, ${t.glowA} 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, ${t.glowB} 0%, transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 60px, rgba(255,255,255,0.015) 61px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 60px, rgba(255,255,255,0.015) 61px)`;

  document.querySelectorAll('.word-card').forEach(c => {
    c.style.background = t.card;
    c.style.borderColor = t.border;
  });
  document.querySelectorAll('.word-text').forEach(w => {
    w.style.color = t.word;
  });
  document.querySelectorAll('.word-num').forEach(n => {
    n.style.color = t.dark ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.18)';
  });

  const header = document.getElementById('header');
  header.style.borderBottomColor = t.dark ? 'rgba(0,0,0,0.15)' : 'rgba(82,183,136,0.2)';
  header.style.background = t.dark ? 'rgba(240,237,232,0.9)' : 'rgba(13,17,23,0.9)';
  document.querySelector('.logo').style.color = t.dark ? '#2d6a4f' : '#a8c686';
  document.querySelectorAll('.control-label').forEach(el => {
    el.style.color = t.dark ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.35)';
  });
  document.querySelectorAll('.swatch').forEach((s,j) => s.classList.toggle('active', j===i));

  // persist accent for btn border
  document.documentElement.style.setProperty('--green-light', t.accent);
  document.documentElement.style.setProperty('--green-mid', t.accent);
  applyTeamColors();
}

let scores = [0, 0];

function updateNames() {
  const a = document.getElementById('team-a-name').value || 'TEAM A';
  const b = document.getElementById('team-b-name').value || 'TEAM B';
  document.getElementById('score-name-a').textContent  = a;
  document.getElementById('score-name-b').textContent  = b;
  document.getElementById('detail-name-a').textContent = a;
  document.getElementById('detail-name-b').textContent = b;
}

function updateBar() {
  const target = parseInt(document.getElementById('play-to').value) || 10;
  document.getElementById('score-target').textContent = target;
  const halfW = (window.innerWidth / 2) - 44; // half screen minus mid-panel half
  const wA = Math.min(scores[0] / target, 1) * halfW;
  const wB = Math.min(scores[1] / target, 1) * halfW;
  document.getElementById('bar-a').style.width = wA + 'px';
  document.getElementById('bar-b').style.width = wB + 'px';
}

function addPoint(team, delta, e) {
  e.stopPropagation();
  if (delta > 0) SFX.point(); else SFX.minus();
  scores[team] = Math.max(0, scores[team] + delta);
  document.getElementById('score-a').textContent = scores[0];
  document.getElementById('score-b').textContent = scores[1];
  updateBar();
  if (delta > 0) {
    const el = document.getElementById(team === 0 ? 'score-a' : 'score-b');
    el.style.transform = 'scale(1.5)';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transform = 'scale(1)';
    }));
  }
}

function resetScores() {
  scores = [0, 0];
  document.getElementById('score-a').textContent = '0';
  document.getElementById('score-b').textContent = '0';
  updateBar();
}

function applyTeamColors() {
  const t = THEMES[activeTheme];
  const cA = t.tA, cB = t.tB;
  document.getElementById('bar-a').style.background = cA;
  document.getElementById('bar-b').style.background = cB;
  document.getElementById('plus-a').style.background = cA + '33';
  document.getElementById('plus-a').style.borderColor = cA + '99';
  document.getElementById('plus-b').style.background = cB + '33';
  document.getElementById('plus-b').style.borderColor = cB + '99';
  document.getElementById('detail-name-a').style.color = cA;
  document.getElementById('detail-name-b').style.color = cB;
  // team name inputs in header get a colored left border
  document.getElementById('team-a-name').style.borderColor = cA + '99';
  document.getElementById('team-b-name').style.borderColor = cB + '99';
}

function handleDetailClick(e) {
  if (e.target.closest('.point-btn') || e.target.closest('.team-btns')) return;
  closeDetail();
}


function getVocab() { return VOCAB_LISTS[activeList]; }

function setVocabList(name) {
  activeList = name;
  document.querySelectorAll('.list-menu-item').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('listBtn_' + name);
  if (btn) btn.classList.add('active');
  const labels = { basic:'📘 Basic', standard:'📗 Standard', yume:'🌸 Yume' };
  document.getElementById('list-label').textContent = labels[name] || name;
  document.getElementById('list-menu').style.display = 'none';
  document.getElementById('word-grid').style.pointerEvents = '';
  const len = getVocab().length;
  document.getElementById('range-from').value = 1;
  document.getElementById('range-to').value = len;
  document.getElementById('range-to').max = len;
  document.getElementById('range-from').max = len;
  shuffle();
}
function openListMenu(e) {
  e.stopPropagation();
  const m = document.getElementById('list-menu');
  const open = m.style.display === 'flex';
  if (open) {
    m.style.display = 'none';
    document.getElementById('word-grid').style.pointerEvents = '';
    return;
  }
  m.style.display = 'flex';
  document.getElementById('word-grid').style.pointerEvents = 'none';
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('#list-menu') && !e.target.closest('#list-menu-btn')) {
    document.getElementById('list-menu').style.display = 'none';
    document.getElementById('word-grid').style.pointerEvents = '';
  }
});


let langMode = 'en';

function toggleLang() {
  langMode = langMode === 'en' ? 'jp' : 'en';
  document.getElementById('lang-btn').textContent = langMode === 'en' ? 'EN → JP' : 'JP → EN';
  renderGrid();
}

function getPool() {
  const from = parseInt(document.getElementById('range-from').value) || 1;
  const to = parseInt(document.getElementById('range-to').value) || 760;
  return getVocab().filter(v => v.n >= from && v.n <= to);
}

function shuffle() {
  SFX.shuffle();
  currentPool = getPool();
  const count = parseInt(document.getElementById('count-select').value) || 8;
  const shuffled = [...currentPool].sort(() => Math.random() - 0.5);
  currentDisplayed = shuffled.slice(0, Math.min(count, shuffled.length));
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('word-grid');
  const count = currentDisplayed.length;
  const t = THEMES[activeTheme];

  let cols, rows;
  if (count <= 2)       { cols = 2; rows = 1; }
  else if (count <= 4)  { cols = 2; rows = 2; }
  else if (count <= 6)  { cols = 3; rows = 2; }
  else if (count <= 8)  { cols = 4; rows = 2; }
  else if (count <= 12) { cols = 4; rows = 3; }
  else                  { cols = 4; rows = 4; }

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows    = `repeat(${rows}, 1fr)`;

  const maxPx = count <= 4 ? 120 : count <= 8 ? 80 : count <= 12 ? 56 : 42;

  grid.innerHTML = '';
  const numColor = t.dark ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.18)';
  currentDisplayed.forEach(word => {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.style.background = t.card;
    card.style.borderColor = t.border;
    const span = document.createElement('span');
    span.className = 'word-text';
    span.style.color = t.word;
    span.style.whiteSpace = 'nowrap';
    span.style.fontSize = maxPx + 'px';
    span.textContent = langMode === 'en' ? word.en.toUpperCase() : word.jp;
    card.innerHTML = `<span class="word-num" style="color:${numColor}">#${word.n}</span>`;
    card.appendChild(span);
    card.addEventListener('click', (e) => {
      const m = document.getElementById('list-menu');
      if (m.style.display === 'flex') { m.style.display = 'none'; return; }
      SFX.swat(); showDetail(word);
    });
    grid.appendChild(card);
  });

  requestAnimationFrame(() => requestAnimationFrame(() => {
    grid.querySelectorAll('.word-card').forEach(card => {
      const span = card.querySelector('.word-text');
      const pad = 24;
      const maxW = card.clientWidth - pad;
      let size = maxPx;
      while (span.scrollWidth > maxW && size > 10) {
        size--;
        span.style.fontSize = size + 'px';
      }
    });
  }));
}

function showDetail(word) {
  // in EN mode: cards show EN, detail reveals JP
  // in JP mode: cards show JP, detail reveals EN
  const big   = langMode === 'en' ? word.jp        : word.en.toUpperCase();
  const small = langMode === 'en' ? word.en.toUpperCase() : word.jp;
  document.getElementById('detail-jp').textContent = big;
  document.getElementById('detail-en').textContent = small;
  document.getElementById('detail-num').textContent = `#${word.n}`;
  const t = THEMES[activeTheme];
  const dv = document.getElementById('detail-view');
  dv.style.background = t.bg;
  document.getElementById('detail-jp').style.color = t.accent;
  document.getElementById('detail-en').style.color = t.dark ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.35)';
  dv.classList.add('active');
}

let suddenDeath = false;
let preSuddenDeathTheme = 0;

function closeDetail() {
  document.getElementById('detail-view').classList.remove('active');
  checkWinCondition();
}

function checkWinCondition() {
  const target = parseInt(document.getElementById('play-to').value) || 10;
  const aWon = scores[0] >= target;
  const bWon = scores[1] >= target;

  if (aWon && bWon && !suddenDeath) {
    // both hit target — enter sudden death
    enterSuddenDeath();
  } else if (aWon && !bWon) {
    showVictory(0);
  } else if (bWon && !aWon) {
    showVictory(1);
  }
}

function enterSuddenDeath() {
  suddenDeath = true;
  SFX.suddenDeath();
  try { playSuddenDeathMusic(); } catch(e) {}
  preSuddenDeathTheme = activeTheme;
  document.getElementById('sd-banner').classList.add('active');

  // override palette to black & red
  document.body.style.background = '#0a0000';
  document.body.style.backgroundImage = `
    radial-gradient(ellipse 70% 50% at 50% 50%, rgba(180,0,0,0.25) 0%, transparent 70%)`;

  const header = document.getElementById('header');
  header.style.background = 'rgba(10,0,0,0.95)';
  header.style.borderBottomColor = 'rgba(200,0,0,0.4)';

  document.querySelectorAll('.word-card').forEach(c => {
    c.style.background = 'rgba(255,255,255,0.03)';
    c.style.borderColor = 'rgba(200,0,0,0.35)';
  });
  document.querySelectorAll('.word-text').forEach(w => w.style.color = '#f0ede8');

  // score bars go red
  document.getElementById('bar-a').style.background = '#cc0000';
  document.getElementById('bar-b').style.background = '#880000';
  document.getElementById('plus-a').style.background = 'rgba(200,0,0,0.25)';
  document.getElementById('plus-a').style.borderColor = 'rgba(200,0,0,0.6)';
  document.getElementById('plus-b').style.background = 'rgba(200,0,0,0.25)';
  document.getElementById('plus-b').style.borderColor = 'rgba(200,0,0,0.6)';

  // in sudden death, point buttons on detail view trigger victory directly
  document.getElementById('plus-a').onclick = (e) => { e.stopPropagation(); showVictory(0); };
  document.getElementById('plus-b').onclick = (e) => { e.stopPropagation(); showVictory(1); };
  // hide minus buttons in sudden death
  document.querySelectorAll('.point-btn.minus').forEach(b => b.style.display = 'none');
}

function spawnConfetti(color1, color2) {
  const vs = document.getElementById('victory-screen');
  const colors = [color1, color2, '#ffffff', '#ffff00'];
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.animationDuration = (2 + Math.random() * 3) + 's';
    el.style.animationDelay = (Math.random() * 1.5) + 's';
    vs.appendChild(el);
  }
}

function showVictory(team) {
  SFX.victory();
  if (suddenDeath) {
    // skip victory screen entirely — just restore and show winner on grid
    document.getElementById('detail-view').classList.remove('active');
    dismissSuddenDeath(team);
    return;
  }

  const t = THEMES[preSuddenDeathTheme];
  const names = [
    document.getElementById('team-a-name').value || 'TEAM A',
    document.getElementById('team-b-name').value || 'TEAM B',
  ];
  const teamColor = team === 0 ? t.tA : t.tB;
  const otherColor = team === 0 ? t.tB : t.tA;

  const bg = document.getElementById('victory-bg');
  bg.style.background = `radial-gradient(ellipse 80% 70% at 50% 40%, ${teamColor}55 0%, ${teamColor}22 40%, #000000cc 100%)`;

  document.getElementById('victory-name').textContent = names[team].toUpperCase();
  document.getElementById('victory-name').style.color = teamColor;
  document.getElementById('victory-label').style.color = '#fff';
  document.getElementById('victory-sub').style.color = '#fff';
  document.getElementById('victory-scores').textContent = `${scores[0]} – ${scores[1]}`;
  document.getElementById('victory-sub').textContent = 'WINS!';

  document.querySelectorAll('.confetti').forEach(el => el.remove());
  spawnConfetti(teamColor, otherColor);
  document.getElementById('victory-screen').classList.add('active');
}

function dismissSuddenDeath(winningTeam) {
  const names = [
    document.getElementById('team-a-name').value || 'TEAM A',
    document.getElementById('team-b-name').value || 'TEAM B',
  ];
  const t = THEMES[preSuddenDeathTheme];
  const color = winningTeam === 0 ? t.tA : t.tB;
  const otherColor = winningTeam === 0 ? t.tB : t.tA;

  // capture scores before reset for display
  const finalScores = [...scores];

  // restore theme and game state immediately (behind the victory screen)
  suddenDeath = false;
  document.getElementById('sd-banner').classList.remove('active');
  scores = [0, 0];
  document.getElementById('score-a').textContent = '0';
  document.getElementById('score-b').textContent = '0';
  document.querySelectorAll('.point-btn.minus').forEach(b => b.style.display = '');
  document.getElementById('plus-a').onclick = (e) => addPoint(0, 1, e);
  document.getElementById('plus-b').onclick = (e) => addPoint(1, 1, e);
  setTheme(preSuddenDeathTheme);
  updateBar();
  shuffle();
  try{ playGameMusic(); }catch(e){}

  // show the same victory screen as a normal win
  const bg = document.getElementById('victory-bg');
  bg.style.background = `radial-gradient(ellipse 80% 70% at 50% 40%, ${color}55 0%, ${color}22 40%, #000000cc 100%)`;
  document.getElementById('victory-name').textContent = names[winningTeam].toUpperCase();
  document.getElementById('victory-name').style.color = color;
  document.getElementById('victory-label').style.color = '#fff';
  document.getElementById('victory-sub').style.color = '#fff';
  document.getElementById('victory-sub').textContent = 'WINS SUDDEN DEATH!';
  document.getElementById('victory-scores').textContent = `${finalScores[0]} – ${finalScores[1]}`;
  document.querySelectorAll('.confetti').forEach(el => el.remove());
  spawnConfetti(color, otherColor);
  document.getElementById('victory-screen').classList.add('active');
}

function dismissVictory() {
  document.getElementById('victory-screen').classList.remove('active');
  document.querySelectorAll('.confetti').forEach(el => el.remove());
  suddenDeath = false;
  document.getElementById('sd-banner').classList.remove('active');
  scores = [0, 0];
  document.getElementById('score-a').textContent = '0';
  document.getElementById('score-b').textContent = '0';
  updateBar();
  document.querySelectorAll('.point-btn.minus').forEach(b => b.style.display = '');
  document.getElementById('plus-a').onclick = (e) => addPoint(0, 1, e);
  document.getElementById('plus-b').onclick = (e) => addPoint(1, 1, e);
  setTheme(preSuddenDeathTheme);
  shuffle();
  try{ playGameMusic(); }catch(e){}
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().then(() => {
      document.getElementById('header').style.display = 'none';
      document.getElementById('fs-btn').textContent = '✕ Exit';
    });
  } else {
    document.exitFullscreen().then(() => {
      document.getElementById('header').style.display = '';
      document.getElementById('fs-btn').textContent = '⛶ Fullscreen';
    });
  }
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) {
    document.getElementById('header').style.display = '';
    document.getElementById('fs-btn').textContent = '⛶ Fullscreen';
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
  if ((e.key === ' ' || e.key === 'Enter') && !document.getElementById('detail-view').classList.contains('active')) shuffle();
});

document.getElementById('range-from').addEventListener('change', shuffle);
document.getElementById('range-to').addEventListener('change', shuffle);

window.addEventListener('resize', updateBar);

// ══════════════════════════════════════
// SFX ENGINE — Web Audio API, no files
// ══════════════════════════════════════
let _actx = null;
function actx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  return _actx;
}

const SFX = {

  // Flyswatter thwack — word card clicked
  swat() {
    const ctx = actx();
    const t = ctx.currentTime;

    // ── Layer 1: sharp crack (high-freq noise burst) ──
    const crackBuf = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
    const crackD = crackBuf.getChannelData(0);
    for (let i = 0; i < crackD.length; i++)
      crackD[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / crackD.length, 1.5);
    const crack = ctx.createBufferSource();
    crack.buffer = crackBuf;
    const crackHp = ctx.createBiquadFilter();
    crackHp.type = 'highpass'; crackHp.frequency.value = 3000;
    const crackG = ctx.createGain();
    crackG.gain.setValueAtTime(2.8, t);
    crackG.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    crack.connect(crackHp); crackHp.connect(crackG); crackG.connect(ctx.destination);
    crack.start(t);

    // ── Layer 2: meaty slap body (mid noise) ──
    const slapBuf = ctx.createBuffer(1, ctx.sampleRate * 0.18, ctx.sampleRate);
    const slapD = slapBuf.getChannelData(0);
    for (let i = 0; i < slapD.length; i++)
      slapD[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / slapD.length, 2.2);
    const slap = ctx.createBufferSource();
    slap.buffer = slapBuf;
    const slapBp = ctx.createBiquadFilter();
    slapBp.type = 'bandpass'; slapBp.frequency.value = 800; slapBp.Q.value = 0.6;
    const slapG = ctx.createGain();
    slapG.gain.setValueAtTime(3.5, t);
    slapG.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    slap.connect(slapBp); slapBp.connect(slapG); slapG.connect(ctx.destination);
    slap.start(t);

    // ── Layer 3: deep thud (pitched punch) ──
    const thud = ctx.createOscillator();
    thud.type = 'sine';
    thud.frequency.setValueAtTime(180, t);
    thud.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    const thudG = ctx.createGain();
    thudG.gain.setValueAtTime(1.8, t);
    thudG.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    thud.connect(thudG); thudG.connect(ctx.destination);
    thud.start(t); thud.stop(t + 0.14);

    // ── Layer 4: wire twang (the swatter wire vibrating) ──
    const twang = ctx.createOscillator();
    twang.type = 'sawtooth';
    twang.frequency.setValueAtTime(420, t + 0.01);
    twang.frequency.exponentialRampToValueAtTime(180, t + 0.15);
    const twangG = ctx.createGain();
    twangG.gain.setValueAtTime(0, t);
    twangG.gain.linearRampToValueAtTime(0.4, t + 0.01);
    twangG.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    const twangHp = ctx.createBiquadFilter();
    twangHp.type = 'highpass'; twangHp.frequency.value = 300;
    twang.connect(twangHp); twangHp.connect(twangG); twangG.connect(ctx.destination);
    twang.start(t); twang.stop(t + 0.18);
  },

  // Shuffle whoosh — cards flying
  shuffle() {
    const ctx = actx();
    const t = ctx.currentTime;
    for (let i = 0; i < 5; i++) {
      const delay = i * 0.045;
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.14, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 1.8);
      const src = ctx.createBufferSource();
      src.buffer = buf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 2000 + i * 400;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.35, t + delay);
      g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.14);
      src.connect(hp); hp.connect(g); g.connect(ctx.destination);
      src.start(t + delay);
    }
  },

  // Point scored — satisfying ink-splat pop
  point() {
    const ctx = actx();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, t);
    osc.frequency.exponentialRampToValueAtTime(820, t + 0.04);
    osc.frequency.exponentialRampToValueAtTime(480, t + 0.12);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.45, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.2);
    // little noise pop on top
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const ns = ctx.createBufferSource(); ns.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 1.5;
    const ng = ctx.createGain(); ng.gain.setValueAtTime(0.3, t);
    ns.connect(bp); bp.connect(ng); ng.connect(ctx.destination);
    ns.start(t);
  },

  // Minus point — short descending blip
  minus() {
    const ctx = actx();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(340, t);
    osc.frequency.exponentialRampToValueAtTime(200, t + 0.12);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.15);
  },

  // Sudden death — low brass stab + tension riser
  suddenDeath() {
    const ctx = actx();
    const t = ctx.currentTime;
    // deep brass stab
    [55, 58, 65].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth'; osc.frequency.value = freq;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.25, t + 0.03 + i * 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.7);
    });
    // rising noise swell
    const buf = ctx.createBuffer(1, ctx.sampleRate * 1.2, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (i / d.length) * 0.6;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const lp = ctx.createBiquadFilter(); lp.type = 'bandpass';
    lp.frequency.setValueAtTime(200, t); lp.frequency.exponentialRampToValueAtTime(2000, t + 1.2);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
    src.connect(lp); lp.connect(g); g.connect(ctx.destination);
    src.start(t);
  },

  // Victory fanfare — ascending 3-note + sparkle
  victory() {
    const ctx = actx();
    const t = ctx.currentTime;
    const notes = [523, 659, 784, 1047]; // C E G C
    notes.forEach((freq, i) => {
      const delay = i * 0.13;
      const osc = ctx.createOscillator();
      osc.type = 'triangle'; osc.frequency.value = freq;
      const osc2 = ctx.createOscillator();
      osc2.type = 'sine'; osc2.frequency.value = freq * 2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t + delay);
      g.gain.linearRampToValueAtTime(i === 3 ? 0.4 : 0.28, t + delay + 0.04);
      g.gain.exponentialRampToValueAtTime(0.001, t + delay + (i === 3 ? 0.9 : 0.35));
      osc.connect(g); osc2.connect(g); g.connect(ctx.destination);
      osc.start(t + delay); osc.stop(t + delay + 1);
      osc2.start(t + delay); osc2.stop(t + delay + 1);
    });
    // sparkle hits
    [0.05, 0.18, 0.34, 0.52, 0.62].forEach(delay => {
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
      bp.frequency.value = 3000 + Math.random() * 2000; bp.Q.value = 3;
      const g = ctx.createGain(); g.gain.setValueAtTime(0.18, t + delay);
      src.connect(bp); bp.connect(g); g.connect(ctx.destination);
      src.start(t + delay);
    });
  },

  // Splash dismiss — satisfying whomp
  splashDismiss() {
    const ctx = actx();
    const t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(280, t);
    osc.frequency.exponentialRampToValueAtTime(120, t + 0.18);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.22);
  },
};

// ══════════════════════════════════
// BGM — two tracks, Web Audio API
// ══════════════════════════════════
let _mgain=null, _muted=false, _mnodes=[], _mtimer=null, _mgen=0, _mtrack=null;

function _mac(){
  const ac=actx(); // share SFX AudioContext
  if(!_mgain){
    _mgain=ac.createGain();
    _mgain.gain.value=_muted?0:0.65;
    _mgain.connect(ac.destination);
  }
  return ac;
}
function _mdest(){ return _mgain||(_mac(),_mgain); }

function toggleMuteMusic(){
  _muted=!_muted;
  if(_mgain) _mgain.gain.setTargetAtTime(_muted?0:0.65,actx().currentTime,0.1);
  document.getElementById('music-btn').textContent=_muted?'🔇':'🎵';
}

function _mn(type,freq,start,dur,vol){
  const ac=_mac(),o=ac.createOscillator(),g=ac.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(vol,start+0.018);
  g.gain.setValueAtTime(vol,Math.max(start+0.018,start+dur-0.06));
  g.gain.linearRampToValueAtTime(0,start+dur);
  o.connect(g); g.connect(_mdest());
  o.start(start); o.stop(start+dur+0.04);
  return o;
}
function _mnoise(start,dur,vol,lp){
  const ac=_mac();
  const buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,0.4);
  const src=ac.createBufferSource(); src.buffer=buf;
  const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp||3000;
  const g=ac.createGain(); g.gain.setValueAtTime(0,start);
  g.gain.linearRampToValueAtTime(vol,start+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,start+dur);
  src.connect(f); f.connect(g); g.connect(_mdest());
  src.start(start); return src;
}
function stopMusic(){
  _mgen++;
  _mnodes.forEach(n=>{try{n.stop(0)}catch(e){}});
  _mnodes=[]; if(_mtimer){clearTimeout(_mtimer);_mtimer=null;} _mtrack=null;
}

// ── TRACK 1: Main game — upbeat J-pop pentatonic (148bpm) ────────────────────
function playGameMusic(){
  if(_mtrack==='game'&&_mnodes.length) return;
  stopMusic(); const _gen=++_mgen; _mtrack='game';
  const ac=_mac(), bpm=148, b=60/bpm, ns=[];

  const C4=261.6,D4=293.7,E4=329.6,G4=392,A4=440,C5=523.3,D5=587.3,E5=659.3,G5=784,A5=880,C6=1046.5;
  const C3=130.8,G3=196,E3=164.8,A3=220;
  const C2=65.4,G2=98,A2=110;

  const mel=[
    [C5,0,0.4],[D5,0.5,0.4],[E5,1,0.9],[G5,2,0.4],[E5,2.5,0.4],[D5,3,0.9],
    [C5,4,0.4],[E5,4.5,0.4],[G5,5,0.9],[A5,6,0.4],[G5,6.5,0.4],[E5,7,0.9],
    [D5,8,0.4],[E5,8.5,0.4],[G5,9,0.9],[E5,10,0.4],[D5,10.5,0.4],[C5,11,0.9],
    [G4,12,0.4],[A4,12.5,0.4],[C5,13,0.9],[D5,14,0.4],[C5,14.5,0.4],[A4,15,0.9],
    [G4,16,0.4],[C5,16.5,0.4],[E5,17,0.9],[G5,18,0.4],[E5,18.5,0.4],[D5,19,0.9],
    [C5,20,0.4],[D5,20.5,0.4],[E5,21,0.4],[G5,21.5,0.4],[A5,22,0.4],[G5,22.5,0.4],[E5,23,0.9],
    [D5,24,0.4],[E5,24.5,0.4],[G5,25,0.9],[A5,26,0.4],[C6,26.5,0.4],[A5,27,0.9],
    [G5,28,0.4],[E5,28.5,0.4],[D5,29,0.4],[C5,29.5,0.4],[D5,30,0.4],[E5,30.5,0.4],[C5,31,0.9],
  ];
  mel.forEach(([f,t,d])=>{
    ns.push(_mn('square',f,ac.currentTime+t*b,d*b,0.08));
    ns.push(_mn('triangle',f,ac.currentTime+t*b,d*b,0.04));
  });

  // harmony thirds
  const harm=[
    [A4,0,1.8],[G4,2,1.8],[E4,4,1.8],[D4,6,1.8],[C4,8,1.8],[A3,10,1.8],
    [G3,12,1.8],[E3,14,1.8],[C4,16,1.8],[A3,18,1.8],[G3,20,1.8],[E3,22,1.8],
    [D4,24,1.8],[C4,26,1.8],[A3,28,1.8],[G3,30,1.8],
  ];
  harm.forEach(([f,t,d])=>ns.push(_mn('triangle',f,ac.currentTime+t*b,d*b,0.035)));

  // bass
  const bassLine=[C2,C2,G2,G2,A2,A2,G2,C2,C2,G2,A2,G2,C2,A2,G2,C2,
                  C2,G2,A2,C2,G2,A2,G2,C2,C2,G2,A2,G2,C2,G2,A2,C2];
  bassLine.forEach((f,t)=>{
    ns.push(_mn('sawtooth',f,ac.currentTime+t*b,b*0.72,0.13));
    ns.push(_mn('sine',f,ac.currentTime+t*b,b*0.72,0.07));
  });

  // drums
  for(let t=0;t<32;t++){
    const ot=ac.currentTime+t*b;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(150,ot); o.frequency.exponentialRampToValueAtTime(40,ot+0.09);
    g.gain.setValueAtTime(0.26,ot); g.gain.exponentialRampToValueAtTime(0.001,ot+0.11);
    o.connect(g); g.connect(_mdest()); o.start(ot); o.stop(ot+0.13); ns.push(o);
    if(t%2===1) ns.push(_mnoise(ac.currentTime+t*b,b*0.13,0.10,3800));
    ns.push(_mnoise(ac.currentTime+t*b,b*0.42,0.02,7500));
    ns.push(_mnoise(ac.currentTime+t*b+b*0.5,b*0.42,0.014,7500));
  }

  ns.forEach(n=>_mnodes.push(n));
  _mtimer=setTimeout(()=>{if(_mgen!==_gen)return;_mtrack=null;playGameMusic();},32*b*1000-120);
}

// ── TRACK 2: Sudden Death — dark Phrygian tension (155bpm) ───────────────────
function playSuddenDeathMusic(){
  if(_mtrack==='sd'&&_mnodes.length) return;
  stopMusic(); const _gen=++_mgen; _mtrack='sd';
  const ac=_mac(), bpm=155, b=60/bpm, ns=[];

  const A4=440,Bb4=466.2,C5=523.3,D5=587.3,E5=659.3,F5=698.5,G5=784;
  const A1=55,E1=41.2;

  const riff=[
    [A4,0,0.35],[C5,0.5,0.35],[E5,1,0.7],[D5,2,0.35],[C5,2.5,0.35],[Bb4,3,0.7],
    [A4,4,0.35],[Bb4,4.5,0.35],[C5,5,0.7],[A4,6,0.35],[G5,6.5,0.35],[F5,7,0.7],
    [A4,8,0.35],[C5,8.5,0.35],[E5,9,0.7],[D5,10,0.35],[E5,10.5,0.35],[A4,11,0.7],
    [G5,12,0.35],[A4,12.5,0.35],[Bb4,13,0.35],[C5,13.5,0.35],[D5,14,0.35],[E5,14.5,0.35],[A4,15,0.7],
  ];
  riff.forEach(([f,t,d])=>{
    ns.push(_mn('sawtooth',f,ac.currentTime+t*b,d*b,0.18));
    ns.push(_mn('square',f*0.5,ac.currentTime+t*b,d*b,0.10));
  });

  // frantic drums
  for(let t=0;t<16;t++){
    const ot=ac.currentTime+t*b;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(160,ot); o.frequency.exponentialRampToValueAtTime(38,ot+0.07);
    g.gain.setValueAtTime(0.45,ot); g.gain.exponentialRampToValueAtTime(0.001,ot+0.09);
    o.connect(g); g.connect(_mdest()); o.start(ot); o.stop(ot+0.11); ns.push(o);
    // half-beat kick
    const ot2=ac.currentTime+(t+0.5)*b;
    const o2=ac.createOscillator(),g2=ac.createGain();
    o2.type='sine'; o2.frequency.setValueAtTime(140,ot2); o2.frequency.exponentialRampToValueAtTime(38,ot2+0.06);
    g2.gain.setValueAtTime(0.28,ot2); g2.gain.exponentialRampToValueAtTime(0.001,ot2+0.08);
    o2.connect(g2); g2.connect(_mdest()); o2.start(ot2); o2.stop(ot2+0.1); ns.push(o2);
    if(t%4===2||t%4===3) ns.push(_mnoise(ac.currentTime+t*b,b*0.12,0.28,2500));
    for(let s=0;s<2;s++) ns.push(_mnoise(ac.currentTime+(t+s*0.5)*b,b*0.38,0.05,8000));
  }

  ns.forEach(n=>_mnodes.push(n));
  _mtimer=setTimeout(()=>{if(_mgen!==_gen)return;_mtrack=null;playSuddenDeathMusic();},16*b*1000-120);
}
