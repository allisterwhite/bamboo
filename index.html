<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BAMBOO! 🎋</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --green: #2d6a4f;
  --green-light: #52b788;
  --green-mid: #40916c;
  --gold: #f4a261;
  --gold-dark: #e76f51;
  --cream: #fefae0;
  --dark: #1b1b2f;
  --darker: #0d0d1a;
  --text-light: #f0ede8;
  --bamboo: #a8c686;
  --panel-bg: rgba(13,13,26,0.92);
}

body {
  min-height: 100vh;
  background: #0d1117;
  background-image:
    radial-gradient(ellipse 70% 50% at 20% 0%, rgba(45,106,79,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(82,183,136,0.1) 0%, transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 60px, rgba(255,255,255,0.015) 61px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 60px, rgba(255,255,255,0.015) 61px);
  color: var(--text-light);
  font-family: 'DM Mono', monospace;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.header {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 10px 20px;
  border-bottom: 1px solid rgba(82,183,136,0.2);
  background: rgba(13,17,23,0.9);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
  gap: 6px;
}
.header-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: nowrap;
}
.header-row.row-top { justify-content: space-between; }
.header-row.row-bot { justify-content: center; position: relative; flex-wrap: wrap; row-gap: 6px; }

.logo {
  font-family: 'Bebas Neue', cursive;
  font-size: 2rem;
  letter-spacing: 0.08em;
  color: var(--bamboo);
  line-height: 1;
  white-space: nowrap;
  flex-shrink: 0;
}
.logo span { color: var(--gold); }

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: nowrap;
}

.control-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.35);
  text-transform: uppercase;
  white-space: nowrap;
}

select, input[type="number"] {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(82,183,136,0.3);
  border-radius: 6px;
  color: var(--text-light);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  padding: 6px 10px;
  cursor: pointer;
  outline: none;
  transition: border-color 0.2s;
}
select:focus, input[type="number"]:focus { border-color: var(--green-light); }
input[type="number"] { width: 72px; }

.btn {
  padding: 7px 16px;
  border-radius: 6px;
  border: 1px solid rgba(82,183,136,0.4);
  background: rgba(82,183,136,0.12);
  color: var(--green-light);
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}
.btn:hover { background: rgba(82,183,136,0.25); border-color: var(--green-light); }
.btn.primary {
  background: var(--green-mid);
  border-color: var(--green-light);
  color: #fff;
}
.btn.primary:hover { background: var(--green-light); }

/* ── Word Grid ── */
.stage {
  flex: 1;
  display: flex;
  align-items: stretch;
  justify-content: stretch;
  padding: 16px 16px 72px;
  overflow: hidden;
  min-height: 0;
}

.word-grid {
  display: grid;
  gap: 14px;
  width: 100%;
  height: 100%;
}

.word-card {
  background: rgba(255,255,255,0.04);
  border: 2px solid rgba(82,183,136,0.25);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
  overflow: hidden;
  user-select: none;
  min-height: 0;
}

.word-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(82,183,136,0.07) 0%, transparent 70%);
  opacity: 0;
  transition: opacity 0.2s;
}

.word-card:hover {
  border-color: var(--green-light);
  background: rgba(82,183,136,0.08);
  transform: scale(1.02);
}
.word-card:hover::before { opacity: 1; }
.word-card:active { transform: scale(0.97); }

.word-text {
  font-family: 'Bebas Neue', cursive;
  letter-spacing: 0.04em;
  color: #fff;
  text-align: center;
  padding: 8px 12px;
  line-height: 1.05;
  text-shadow: 0 0 20px rgba(82,183,136,0.3);
  font-size: 5vw;
}

.word-num {
  position: absolute;
  top: 8px;
  left: 10px;
  font-family: 'Bebas Neue', cursive;
  font-size: 1.1rem;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.45);
}

/* ── Detail View ── */
#detail-view {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(13,17,23,0.97);
  z-index: 100;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 40px;
}

#detail-view.active { display: flex; }

.detail-en {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 20px;
}

.detail-jp {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: clamp(3.5rem, 10vw, 8rem);
  color: var(--green-light);
  text-align: center;
  text-shadow: 0 0 40px rgba(82,183,136,0.25);
  line-height: 1.15;
}

.detail-back {
  margin-top: 48px;
  font-size: 11px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}

.back-arrow {
  width: 28px;
  height: 28px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}

.detail-num {
  position: fixed;
  top: 20px;
  right: 24px;
  font-size: 11px;
  color: rgba(255,255,255,0.18);
  letter-spacing: 0.1em;
}

/* ── Range filter UI ── */
.range-row {
  display: flex;
  align-items: center;
  gap: 6px;
}
.range-sep {
  color: rgba(255,255,255,0.25);
  font-size: 11px;
}

/* ── Color swatches ── */
.swatch {
  width: 18px; height: 18px;
  border-radius: 50%;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: transform 0.18s, border-color 0.18s;
  flex-shrink: 0;
}
.swatch:hover { transform: scale(1.25); }
.swatch.active { border-color: rgba(255,255,255,0.75); transform: scale(1.15); }
.swatch-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.12); }

/* ── Scoreboard bar ── */
#scoreboard {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 56px;
  z-index: 200;
  display: flex;
  align-items: stretch;
  pointer-events: none;
}
/* dark dead zone fills the full bar behind everything */
#sb-bg {
  position: absolute;
  inset: 0;
  background: rgba(10,10,18,0.82);
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(255,255,255,0.08);
}
/* bars are positioned absolutely from center */
.score-bar {
  position: absolute;
  top: 0; bottom: 0;
  display: flex;
  align-items: center;
  overflow: hidden;
  width: 0;
  transition: width 0.5s cubic-bezier(0.34,1.2,0.64,1);
}
/* A grows LEFT from center */
.score-bar.bar-a {
  right: 50%;
  justify-content: flex-end;
  padding-right: 16px;
}
/* B grows RIGHT from center */
.score-bar.bar-b {
  left: 50%;
  justify-content: flex-start;
  padding-left: 16px;
}
.score-inner { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.score-name {
  display: inline-block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.85);
}
.score-num {
  font-family: 'Bebas Neue', cursive;
  font-size: 1.8rem;
  line-height: 1;
  color: #fff;
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
/* center marker */
.score-mid {
  position: absolute;
  left: 50%;
  top: 0; bottom: 0;
  transform: translateX(-50%);
  width: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  z-index: 2;
}
.score-mid-label {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.25);
  text-transform: uppercase;
}
.score-target {
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  color: rgba(255,255,255,0.4);
}

/* ── Team name inputs in header ── */
.team-inputs {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
/* long names that don't fit on the controls line get a line of their own */
.team-inputs.own-line { order: 99; flex-basis: 100%; justify-content: center; }
.swatch-divider.hide { display: none; }
input.team-name {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(82,183,136,0.25);
  border-radius: 6px;
  color: rgba(255,255,255,0.7);
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  letter-spacing: 0.08em;
  padding: 5px 10px;
  width: 90px;
  flex-shrink: 0;
  outline: none;
  transition: border-color 0.2s;
}
input.team-name:focus { border-color: var(--green-light); color: #fff; }
.team-sep {
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  color: rgba(255,255,255,0.2);
}
.btn-reset-score {
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 5px;
  border: 1px solid rgba(255,255,255,0.1);
  background: transparent;
  color: rgba(255,255,255,0.25);
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.05em;
  transition: all 0.15s;
}
.btn-reset-score:hover { color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.3); }

/* ── Point buttons on detail view ── */
.detail-score-row {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 40px;
}
.team-btns {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.team-btn-name {
  display: block;
  max-width: 38vw;
  text-align: center;
  line-height: 1.05;
  overflow-wrap: anywhere;
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.5);
}
.team-btn-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.point-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 60px;
  height: 60px;
  border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.07);
  cursor: pointer;
  transition: all 0.18s;
  user-select: none;
  font-family: 'Bebas Neue', cursive;
  font-size: 1.8rem;
  color: #fff;
  line-height: 1;
}
.point-btn:hover { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); transform: scale(1.07); }
.point-btn:active { transform: scale(0.94); }
.point-btn.minus { font-size: 1.4rem; color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.03); }
.point-btn.minus:hover { color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.1); }
.detail-score-sep {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,0.2);
  letter-spacing: 0.1em;
}

/* ── Victory screen ── */
#victory-screen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 300;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#victory-screen.active { display: flex; }

.victory-bg {
  position: absolute;
  inset: 0;
  transition: background 0.6s ease;
}
.victory-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  text-align: center;
  padding: 40px;
}
.victory-label {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  opacity: 0.55;
  animation: vfadein 0.8s ease both;
}
.victory-name {
  max-width: 92vw;
  overflow-wrap: anywhere;
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(5rem, 16vw, 12rem);
  line-height: 0.9;
  letter-spacing: 0.04em;
  animation: vslide 0.7s cubic-bezier(0.22,1,0.36,1) both;
}
.victory-sub {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(1.4rem, 4vw, 2.6rem);
  letter-spacing: 0.18em;
  opacity: 0.7;
  animation: vfadein 1s ease 0.3s both;
}
.victory-scores {
  font-family: 'DM Mono', monospace;
  font-size: 1rem;
  letter-spacing: 0.1em;
  opacity: 0.35;
  margin-top: 8px;
  animation: vfadein 1s ease 0.5s both;
}
.victory-tap {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  opacity: 0.22;
  margin-top: 48px;
  animation: vpulse 2s ease 1s infinite;
}
/* Confetti particle */
.confetti {
  position: absolute;
  width: 10px; height: 10px;
  border-radius: 2px;
  pointer-events: none;
  animation: cfall linear forwards;
}
/* Sudden death banner */
#sd-banner {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 250;
  background: #cc0000;
  padding: 8px 0;
  text-align: center;
  font-family: 'Bebas Neue', cursive;
  font-size: 1.3rem;
  letter-spacing: 0.2em;
  color: #fff;
  animation: sdpulse 1s ease infinite alternate;
}
#sd-banner.active { display: block; }

@keyframes vfadein { from { opacity:0; transform:translateY(12px); } to {} }
@keyframes vslide  { from { opacity:0; transform:translateY(40px) scale(0.85); } to {} }
@keyframes vpulse  { from { opacity:0.22; } to { opacity:0.5; } }
@keyframes cfall   {
  0%   { transform: translateY(-20px) rotate(0deg); opacity:1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity:0; }
}
@keyframes sdpulse { from { letter-spacing:0.18em; } to { letter-spacing:0.28em; } }
@keyframes sdflashout { from { opacity:1; } to { opacity:0; } }

/* ── Splash screen ── */
#splash {
  position: fixed; inset: 0; z-index: 600;
  background: #0d0d0f;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; overflow: hidden;
}
#splash.hide { animation: splashOut 0.55s ease forwards; pointer-events: none; }
@keyframes splashOut { to { opacity:0; transform:scale(1.06); } }

.s-bg {
  position: absolute;
  font-size: clamp(100px, 22vw, 200px);
  opacity: 0.035; pointer-events: none; user-select: none;
  filter: blur(1px);
}
.s-bg:nth-child(1){top:2%;left:2%;  animation:sdrift 11s ease-in-out infinite alternate;}
.s-bg:nth-child(2){top:2%;right:2%; animation:sdrift 11s ease-in-out -4s infinite alternate;}
.s-bg:nth-child(3){bottom:2%;left:2%;  animation:sdrift 11s ease-in-out -7s infinite alternate;}
.s-bg:nth-child(4){bottom:2%;right:2%;animation:sdrift 11s ease-in-out -2s infinite alternate;}
@keyframes sdrift {
  from { transform: translateY(0) rotate(-10deg); }
  to   { transform: translateY(-28px) rotate(10deg); }
}

.s-content {
  position: relative; z-index: 1; text-align: center;
  animation: sIn .9s cubic-bezier(.34,1.56,.64,1) both;
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
@keyframes sIn { from{transform:scale(.65);opacity:0;} to{transform:scale(1);opacity:1;} }

.s-emoji {
  font-size: clamp(72px,18vw,130px); line-height: 1; margin-bottom: 18px;
  filter: drop-shadow(0 0 40px rgba(168,198,134,0.7));
  animation: sEmojiPop .55s cubic-bezier(.34,1.56,.64,1) .12s both;
  display: block;
}
@keyframes sEmojiPop {
  from { transform:scale(0) rotateY(90deg); opacity:0; }
  to   { transform:scale(1) rotateY(0);    opacity:1; }
}

.s-title {
  font-family: 'Bebas Neue', cursive;
  font-size: clamp(52px, 14vw, 120px);
  letter-spacing: 0.1em; line-height: 0.95;
  color: #a8c686;
  text-shadow: 0 0 40px rgba(168,198,134,0.6), 0 0 80px rgba(168,198,134,0.2);
  margin-bottom: 4px;
}
.s-title span { color: #f4a261; }

.s-sub {
  font-family: 'DM Mono', monospace;
  font-size: clamp(9px, 2vw, 13px);
  letter-spacing: 0.32em; text-transform: uppercase;
  color: rgba(255,255,255,0.2); margin-bottom: 32px;
}

.s-line {
  width: min(280px, 70vw); height: 1px;
  background: linear-gradient(90deg, transparent, rgba(168,198,134,0.6), transparent);
  margin: 0 auto 30px;
}

.s-dots { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; }
.s-dot {
  width: 10px; height: 10px; border-radius: 50%;
  animation: sDotPop .4s cubic-bezier(.34,1.56,.64,1) both;
}
.s-dot:nth-child(1){ background:#ff5600; animation-delay:.3s; }
.s-dot:nth-child(2){ background:#d43bff; animation-delay:.38s; }
.s-dot:nth-child(3){ background:#ff3892; animation-delay:.46s; }
.s-dot:nth-child(4){ background:#ffe000; animation-delay:.54s; }
.s-dot:nth-child(5){ background:#00d476; animation-delay:.62s; }
.s-dot:nth-child(6){ background:#ff7800; animation-delay:.70s; }
@keyframes sDotPop { from{transform:scale(0);opacity:0;} to{transform:scale(1);opacity:1;} }

.s-tap {
  font-family: 'DM Mono', monospace;
  font-size: clamp(9px, 1.8vw, 12px);
  letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(255,255,255,0.2);
  animation: sTapPulse 2s ease 1s infinite alternate;
}
@keyframes sTapPulse { from{opacity:0.2;} to{opacity:0.55;} }

.music-btn {
  padding: 6px 10px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.05);
  color: rgba(255,255,255,0.5); font-size: 14px;
  cursor: pointer; transition: all 0.18s; line-height: 1;
}
.music-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

.list-menu-item {
  font-family: 'Bebas Neue', cursive;
  font-size: 1rem; letter-spacing: 0.08em;
  padding: 10px 16px; border-radius: 6px;
  border: 1px solid transparent;
  background: #1a1f2e; color: rgba(255,255,255,0.8);
  cursor: pointer; transition: all 0.15s; text-align: left; width: 100%;
}
.list-menu-item:hover { background: #252d40; color: #fff; border-color: rgba(82,183,136,0.4); }
.list-menu-item.active { background: rgba(82,183,136,0.25); border-color: var(--green-light); color: #fff; }
</style>
</head>
<body>

<div id="splash" onclick="dismissSplash()" style="position:fixed;inset:0;z-index:600;cursor:pointer;">
  <div class="s-bg" style="pointer-events:none">🎋</div>
  <div class="s-bg" style="pointer-events:none">🎋</div>
  <div class="s-bg" style="pointer-events:none">🎋</div>
  <div class="s-bg" style="pointer-events:none">🎋</div>
  <div class="s-content" style="pointer-events:none">
    <span class="s-emoji">🎋</span>
    <div class="s-title">BAM<span>BOO</span>!</div>
    <div class="s-sub">English Vocab Flyswatter Game</div>
    <div class="s-line"></div>
    <div class="s-dots">
      <div class="s-dot"></div>
      <div class="s-dot"></div>
      <div class="s-dot"></div>
      <div class="s-dot"></div>
      <div class="s-dot"></div>
      <div class="s-dot"></div>
    </div>
    <div class="s-tap">Tap anywhere to play</div>

let scores = [0, 0];

// ── Fit team names to the space they have ────────────────────────────────────
// Measures with a hidden span that copies the element's font, then picks the
// biggest font size (between min and max px) that fits on one line. If even the
// minimum doesn't fit, the text is allowed to wrap.
let _measureEl=null;
function textWidth(el,text,px){
  if(!_measureEl){_measureEl=document.createElement('span');_measureEl.style.cssText='position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:nowrap;';document.body.appendChild(_measureEl);}
  const cs=getComputedStyle(el);
  _measureEl.style.fontFamily=cs.fontFamily;_measureEl.style.fontWeight=cs.fontWeight;
  _measureEl.style.letterSpacing=(parseFloat(cs.letterSpacing)||0)/(parseFloat(cs.fontSize)||16)*px+'px';
  _measureEl.style.fontSize=px+'px';_measureEl.textContent=text;
  return _measureEl.getBoundingClientRect().width;
}
function fitText(el,maxW,maxPx,minPx){
  if(!el)return;
  const text=el.textContent||el.value||'';
  el.style.fontSize='';el.style.whiteSpace='nowrap';
  let px=maxPx;
  while(px>minPx&&textWidth(el,text,px)>maxW)px-=1;
  el.style.fontSize=px+'px';
  if(textWidth(el,text,px)>maxW)el.style.whiteSpace='normal';
  return px;
}
function fitNameInputs(){
  const ins=['team-a-name','team-b-name'].map(id=>document.getElementById(id));
  const group=document.getElementById('team-inputs'), row=group.parentElement;
  const cap=Math.min(280,row.clientWidth/2-70);
  // width each box needs at a comfortable font size
  const need=(inp,px)=>textWidth(inp,inp.value||'',px)+24;
  ins.forEach(i=>{i.style.width='90px';i.style.fontSize='';i.style.whiteSpace='';});
  // free space if the whole header row stays on one line (boxes at 90px)
  const gap=parseFloat(getComputedStyle(row).columnGap)||10;
  const kids=[...row.children].filter(k=>k.offsetParent!==null);
  const used=kids.reduce((s,k)=>s+k.getBoundingClientRect().width,0)+gap*(kids.length-1);
  const slack=Math.max(0,row.clientWidth-used-4);
  // one line if the names still fit at >=12px; otherwise let the team group wrap
  // onto its own line and give each box up to `cap`
  const oneLineMax=90+slack/2;
  const fitsOneLine=ins.every(i=>need(i,11)<=oneLineMax);
  const maxW=fitsOneLine?oneLineMax:Math.max(90,cap);
  group.classList.toggle('own-line',!fitsOneLine);
  document.getElementById('team-inputs-div').classList.toggle('hide',!fitsOneLine);
  const rem=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
  ins.forEach(inp=>{
    const px=fitText(inp,Math.min(maxW,280)-24,rem,10); inp.style.whiteSpace='';
    inp.style.width=Math.max(90,Math.min(maxW,280,need(inp,px)))+'px';
  });
}
function fitScoreNames(){
  const rem=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
  fitBarNames();
  ['detail-name-a','detail-name-b'].forEach(id=>{
    const el=document.getElementById(id);
    fitText(el,window.innerWidth*0.38,Math.max(rem,Math.min(28,window.innerHeight*0.035)),12);

}

function updateBar() {
  const target = parseInt(document.getElementById('play-to').value) || 10;
  document.getElementById('score-target').textContent = target;
  const halfW = (window.innerWidth / 2) - 44; // half screen minus mid-panel half
  const wA = Math.min(scores[0] / target, 1) * halfW;
  const wB = Math.min(scores[1] / target, 1) * halfW;
  document.getElementById('bar-a').style.width = wA + 'px';
  document.getElementById('bar-b').style.width = wB + 'px';
  _barW=[wA,wB];
  if(typeof fitBarNames==='function') fitBarNames();
}
let _barW=[0,0];
// fit each team name into the room its bar will have (target width, not the
// mid-animation width): shrink down to 10px, then ellipsis
function fitBarNames(){
  const rem=parseFloat(getComputedStyle(document.documentElement).fontSize)||16;
  ['a','b'].forEach((k,i)=>{
    const name=document.getElementById('score-name-'+k), num=document.getElementById('score-'+k);
    const avail=_barW[i]-16-10-(num.getBoundingClientRect().width||30)-6;
    name.style.maxWidth='';
    fitText(name,Math.max(1,avail),rem,10);
    name.style.whiteSpace='nowrap';
    name.style.maxWidth=Math.max(0,avail)+'px';
  });
}

function addPoint(team, delta, e) {
  e.stopPropagation();
  if (delta > 0) SFX.point(); else SFX.minus();
  scores[team] = Math.max(0, scores[team] + delta);
  document.getElementById('score-a').textContent = scores[0];
  document.getElementById('score-b').textContent = scores[1];
  updateBar();
  if (delta > 0) {
    const el = document.getElementById(team === 0 ? 'score-a' : 'score-b');
    el.style.transform = 'scale(1.5)';
    requestAnimationFrame(() => requestAnimationFrame(() => {

  currentPool = getPool();
  const count = parseInt(document.getElementById('count-select').value) || 8;
  const shuffled = [...currentPool].sort(() => Math.random() - 0.5);
  currentDisplayed = shuffled.slice(0, Math.min(count, shuffled.length));

function renderGrid() {
  const grid = document.getElementById('word-grid');
  const count = currentDisplayed.length;
  const t = THEMES[activeTheme];

  let cols, rows;
  if (count <= 2)       { cols = 2; rows = 1; }
  else if (count <= 4)  { cols = 2; rows = 2; }
  else if (count <= 6)  { cols = 3; rows = 2; }
  else if (count <= 8)  { cols = 4; rows = 2; }
  else if (count <= 12) { cols = 4; rows = 3; }
  else                  { cols = 4; rows = 4; }

  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.style.gridTemplateRows    = `repeat(${rows}, 1fr)`;

  const maxPx = count <= 4 ? 120 : count <= 8 ? 80 : count <= 12 ? 56 : 42;

  grid.innerHTML = '';
  const numColor = t.dark ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.18)';
  currentDisplayed.forEach(word => {
    const card = document.createElement('div');
    card.className = 'word-card';
    card.style.background = t.card;
    card.style.borderColor = t.border;
    const span = document.createElement('span');
    span.className = 'word-text';
    span.style.color = t.word;
    span.style.whiteSpace = 'nowrap';
    span.style.fontSize = maxPx + 'px';
    span.textContent = langMode === 'en' ? word.en.toUpperCase() : word.jp;
    card.innerHTML = `<span class="word-num" style="color:${numColor}">#${word.n}</span>`;
    card.appendChild(span);
    card.addEventListener('click', (e) => {
      const m = document.getElementById('list-menu');
      if (m.style.display === 'flex') { m.style.display = 'none'; return; }
      SFX.swat(); showDetail(word);
    });
    grid.appendChild(card);
  });

  requestAnimationFrame(() => requestAnimationFrame(() => {
    grid.querySelectorAll('.word-card').forEach(card => {
      const span = card.querySelector('.word-text');
      const pad = 24;
      const maxW = card.clientWidth - pad;
      let size = maxPx;
      while (span.scrollWidth > maxW && size > 10) {
        size--;
        span.style.fontSize = size + 'px';
      }
    });
  }));
}

function checkWinCondition() {
  const target = parseInt(document.getElementById('play-to').value) || 10;
  const aWon = scores[0] >= target;
  const bWon = scores[1] >= target;

  if (aWon && bWon && !suddenDeath) {
    // both hit target — enter sudden death
    enterSuddenDeath();
  } else if (aWon && !bWon) {
    showVictory(0);
  } else if (bWon && !aWon) {
    showVictory(1);
  }
}

// ══════════════════════════════════════════════════════════════════════════════
// AUDIO — one AudioContext, one master bus (compressor/limiter), separate
// music and SFX buses so neither can blow out the speakers.
// ══════════════════════════════════════════════════════════════════════════════
let _actx=null, _master=null, _musicBus=null, _sfxBus=null, _muted=false;
const MUSIC_VOL=0.55, SFX_VOL=0.5;
function actx(){
  if(!_actx){
    _actx=new (window.AudioContext||window.webkitAudioContext)();
    const comp=_actx.createDynamicsCompressor();
    comp.threshold.value=-12; comp.knee.value=6; comp.ratio.value=4;
    comp.attack.value=0.003; comp.release.value=0.2;
    _master=_actx.createGain(); _master.gain.value=0.9;
    _master.connect(comp); comp.connect(_actx.destination);
    _musicBus=_actx.createGain(); _musicBus.gain.value=_muted?0:MUSIC_VOL; _musicBus.connect(_master);
    _sfxBus=_actx.createGain(); _sfxBus.gain.value=SFX_VOL; _sfxBus.connect(_master);
  }
  if(_actx.state==='suspended') _actx.resume();
  return _actx;
}
function sfxOut(){ actx(); return _sfxBus; }
function musicOut(){ actx(); return _musicBus; }

// ── Notes ─────────────────────────────────────────────────────────────────────
const _PC={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function _midi(n){const m=/^([A-G][#b]?)(-?\d)$/.exec(n);if(!m)throw new Error('bad note '+n);return 12*(+m[2]+1)+_PC[m[1]];}
function _hz(n){const m=typeof n==='number'?n:_midi(n);return 440*Math.pow(2,(m-69)/12);}
const _CHORDS={D:['D','F#','A'],Bm:['B','D','F#'],G:['G','B','D'],A:['A','C#','E'],Em:['E','G','B'],
  Dm:['D','F','A'],Eb:['Eb','G','Bb'],Gm:['G','Bb','D'],Bb:['Bb','D','F'],A7:['A','C#','E','G']};
function _voicing(ch,oct){let prev=-1;return _CHORDS[ch].map(pc=>{let m=12*(oct+1)+_PC[pc];while(m<=prev)m+=12;prev=m;return m;});}
function _root(ch,oct){return 12*(oct+1)+_PC[_CHORDS[ch][0]];}
function _tone(ch,oct,i){const v=_voicing(ch,oct);return v[i%v.length]+12*Math.floor(i/v.length);}
// Melody bars: 16 tokens per bar. Note = start, "." = hold, "-" = rest.
function _parseBar(str){
  const tok=str.trim().split(/\s+/);
  if(tok.length!==16){console.error('bar needs 16 steps:',str);while(tok.length<16)tok.push('-');tok.length=16;}
  const ev=[];let cur=null;
  tok.forEach((t,i)=>{if(t==='.'){if(cur)cur.d++;return;}if(t==='-'){cur=null;return;}cur={s:i,n:_midi(t),d:1};ev.push(cur);});
  return ev;
}
function _parseMel(bars){return bars.map(_parseBar);}
function _rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}

// ── Synth (ported from the Dungeon sound lab) ────────────────────────────────
class Synth{
  constructor(ctx,out){
    this.ctx=ctx;this.out=out;this.pw={};this.pans={};
    const len=ctx.sampleRate,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    this.noiseBuf=buf;
    this.dist=ctx.createWaveShaper();const k=25,n=1024,c=new Float32Array(n);
    for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(1+k)*x/(1+k*Math.abs(x));}
    this.dist.curve=c;const dlp=ctx.createBiquadFilter();dlp.type='lowpass';dlp.frequency.value=1300;
    const dg=ctx.createGain();dg.gain.value=0.12;this.dist.connect(dlp);dlp.connect(dg);dg.connect(out);
  }
  pan(v){if(this.pans[v])return this.pans[v];if(!this.ctx.createStereoPanner)return this.out;const p=this.ctx.createStereoPanner();p.pan.value=v;p.connect(this.out);return this.pans[v]=p;}
  wave(duty){
    if(!this.pw[duty]&&this.ctx.createPeriodicWave){const n=40,re=new Float32Array(n),im=new Float32Array(n);
      for(let k=1;k<n;k++)re[k]=(2/(k*Math.PI))*Math.sin(Math.PI*k*duty);
      this.pw[duty]=this.ctx.createPeriodicWave(re,im);}
    return this.pw[duty];
  }
  voice(o){
    const c=this.ctx,t=o.t,end=t+o.dur,rel=o.rel??0.05;
    const osc=c.createOscillator();
    const pw=o.duty?this.wave(o.duty):null;
    if(pw)osc.setPeriodicWave(pw);else osc.type=o.type||'square';
    osc.frequency.setValueAtTime(o.f,t);
    if(o.slideTo)osc.frequency.exponentialRampToValueAtTime(o.slideTo,t+(o.slideDur||o.dur));
    if(o.detune)osc.detune.value=o.detune;
    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.2;lg.gain.value=o.f*0.007;l.connect(lg);lg.connect(osc.frequency);l.start(t+0.15);l.stop(end+rel+0.1);}
    const g=c.createGain(),a=o.a??0.005;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.vol,t+a);
    if(o.sus!=null){g.gain.setTargetAtTime(o.vol*o.sus,t+a,o.decay||0.12);g.gain.setTargetAtTime(0,end,rel);}
    else g.gain.exponentialRampToValueAtTime(0.0001,end);
    let node=osc;
    if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(o.lp,t);if(o.lpTo)f.frequency.exponentialRampToValueAtTime(o.lpTo,end);f.Q.value=o.q||0.7;osc.connect(f);node=f;}
    node.connect(g);g.connect(o.dest||this.out);
    osc.start(t);osc.stop(end+rel*6+0.05);
  }
  noise(o){
    const c=this.ctx,src=c.createBufferSource();src.buffer=this.noiseBuf;
    const f=c.createBiquadFilter();f.type=o.ft||'highpass';f.frequency.value=o.ff||6000;if(o.q)f.Q.value=o.q;
    const g=c.createGain(),a=o.a??0.001;
    g.gain.setValueAtTime(0,o.t);g.gain.linearRampToValueAtTime(o.vol,o.t+a);g.gain.exponentialRampToValueAtTime(0.0001,o.t+o.dur);
    src.connect(f);f.connect(g);g.connect(o.dest||this.out);src.start(o.t,Math.random()*0.5);src.stop(o.t+o.dur+0.05);
  }
  // instruments
  lead(m,t,d,v,o={}){this.voice(Object.assign({f:_hz(m),t,dur:d,vol:v,duty:0.25,sus:0.75,decay:0.2,rel:0.06,vib:d>0.3,lp:4200},o));}
  // bamboo flute: soft triangle + pulse, vibrato, a puff of breath on the attack
  flute(m,t,d,v,o={}){
    this.voice(Object.assign({f:_hz(m),t,dur:d,vol:v,type:'triangle',a:0.03,sus:0.85,decay:0.2,rel:0.08,vib:d>0.25},o));
    this.voice(Object.assign({f:_hz(m),t,dur:d,vol:v*0.25,duty:0.5,a:0.04,sus:0.8,rel:0.08,lp:1800,vib:d>0.25},o));
    this.noise({t,dur:0.08,vol:v*0.5,ft:'bandpass',ff:_hz(m)*2,q:2,dest:o.dest});
  }
  // koto / shamisen pluck: thin pulse with a fast filter drop
  koto(m,t,d,v,o={}){
    this.voice(Object.assign({f:_hz(m),t,dur:Math.max(d,0.25),vol:v,duty:0.125,lp:4500,lpTo:600},o));
    this.voice(Object.assign({f:_hz(m)*2,t,dur:0.12,vol:v*0.3,type:'triangle'},o));
  }
  brass(m,t,d,v,o={}){this.voice(Object.assign({f:_hz(m),t,dur:d,vol:v,type:'sawtooth',a:0.03,sus:0.8,decay:0.15,rel:0.08,lp:1400,lpTo:3200},o));this.voice(Object.assign({f:_hz(m),t,dur:d,vol:v*0.6,duty:0.5,a:0.02,sus:0.8,rel:0.08,lp:2500},o));}
  bass(m,t,d,v,o={}){this.voice(Object.assign({f:_hz(m),t,dur:d,vol:v,type:'triangle',sus:0.85,rel:0.05},o));this.voice(Object.assign({f:_hz(m),t,dur:d,vol:v*0.35,duty:0.5,sus:0.8,rel:0.05,lp:500},o));}
  distBass(m,t,d,v){this.voice({f:_hz(m),t,dur:d,vol:v,type:'sawtooth',sus:0.9,rel:0.03,dest:this.dist});this.voice({f:_hz(m-12),t,dur:d,vol:v*0.45,type:'square',sus:0.9,rel:0.03,lp:300});}
  bell(m,t,d,v,o={}){const f=_hz(m);this.voice(Object.assign({f,t,dur:d,vol:v,type:'sine',a:0.002},o));this.voice(Object.assign({f:f*2.76,t,dur:d*0.4,vol:v*0.35,type:'sine',a:0.002},o));}
  pad(ms,t,d,v,o={}){ms.forEach(m=>{[-8,8].forEach(dt=>this.voice(Object.assign({f:_hz(m),t,dur:d,vol:v/ms.length/2,type:'sawtooth',detune:dt,a:0.35,sus:0.9,decay:0.3,rel:0.5,lp:o.lp||900},o)));});}
  kick(t,v){this.voice({f:150,t,dur:0.26,vol:v,type:'sine',slideTo:45,slideDur:0.11,a:0.001});}
  // taiko: deep, round, a little skin noise
  taiko(t,v,f=95){this.voice({f,t,dur:0.45,vol:v,type:'sine',slideTo:f*0.55,slideDur:0.3,a:0.002});this.noise({t,dur:0.09,vol:v*0.35,ft:'lowpass',ff:700});}
  snare(t,v){this.noise({t,dur:0.14,vol:v,ft:'bandpass',ff:1900,q:0.8});this.voice({f:200,t,dur:0.07,vol:v*0.5,type:'triangle',slideTo:140,a:0.001});}
  hat(t,v,open){this.noise({t,dur:open?0.2:0.04,vol:v,ft:'highpass',ff:7500});}
  // bamboo clack / woodblock
  clack(t,v,f=1150){this.voice({f,t,dur:0.06,vol:v,type:'sine',slideTo:f*0.85,slideDur:0.05,a:0.001});this.noise({t,dur:0.025,vol:v*0.6,ft:'bandpass',ff:f*2,q:4});}
  crash(t,v){this.noise({t,dur:1.4,vol:v,ft:'highpass',ff:4500});}
  swell(t,d,v){const c=this.ctx,src=c.createBufferSource();src.buffer=this.noiseBuf;src.loop=true;const f=c.createBiquadFilter();f.type='highpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(9000,t+d);const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+d);g.gain.linearRampToValueAtTime(0,t+d+0.05);src.connect(f);f.connect(g);g.connect(this.out);src.start(t);src.stop(t+d+0.1);}
}
function _melAt(E,bars,bar,s,t,fn,shift=0){const b=bars[bar%bars.length];for(const e of b)if(e.s===s)fn(e.n+shift,t,e.d*E.stepSec*0.95);}

// ══════════════════════════════════════════════════════════════════════════════
//  THE BAMBOO THEME + TRACKS
//  All three share one melody idea (the "swat" motif: a quick run up to a held
//  note, then a bounce back down) so the game sounds like one soundtrack.
// ══════════════════════════════════════════════════════════════════════════════
const BAMBOO_TRACKS={
// ── Main game: "Bamboo Grove Dash" — D major pentatonic, 128 BPM ─────────────
// Builds by itself over the first loops: 0 koto + bass + clacks,
// 1 bamboo flute melody, 2 taiko + hats, 3+ bells and the octave flute.
game:{
  bpm:128,
  bars:['D','D','Bm','Bm','G','G','A','A'],
  mel:_parseMel([
    'D5 . . E5 F#5 . A5 . B5 . A5 . F#5 . E5 .',
    'D5 . . . . . - - A4 . B4 . D5 . E5 .',
    'F#5 . . E5 D5 . B4 . D5 . E5 . F#5 . . .',
    'E5 . . . D5 . B4 . A4 . . . - - - -',
    'B4 . D5 . E5 . G5 . A5 . . . G5 . E5 .',
    'D5 . E5 . B4 . . . - - D5 . E5 . G5 .',
    'A5 . . . B5 . A5 . F#5 . E5 . D5 . E5 .',
    'E5 . . . . . . . - - - - A4 . C#5 .']),
  tick(E,step,t){
    const bar=Math.floor(step/16),s=step%16,ch=this.bars[bar%8],S=E.stepSec;
    const lvl=Math.min(3,Math.floor(step/128)); // one level per 8-bar loop
    // bass: root on 1, fifth on the "and" of 2, octave pickup
    if(s===0)E.bass(_root(ch,2),t,5*S,0.16);
    if(s===6)E.bass(_root(ch,2)+7,t,2*S,0.11);
    if(s===10)E.bass(_root(ch,2)+12,t,2*S,0.1);
    if(s===12)E.bass(_root(ch,2)+7,t,3*S,0.11);
    // koto arpeggio (always on)
    if(s%2===0){const pat=[0,1,2,3,2,1,2,4];E.koto(_tone(ch,4,pat[s/2]),t,1.5*S,0.045,{dest:E.pan(-0.25)});}
    // bamboo clacks — the signature groove
    if(s===0||s===3||s===8||s===11)E.clack(t,s%8===0?0.07:0.045);
    if(s===14)E.clack(t,0.04,1500);
    if(s===0||s===8)E.kick(t,0.22);
    if(s===4||s===12)E.snare(t,0.045);
    // melody
    if(lvl>=1)_melAt(E,this.mel,bar,s,t,(m,tt,d)=>E.flute(m,tt,Math.max(d,0.14),0.06,{dest:E.pan(0.15)}));
    if(lvl>=2){
      if(s%2===0)E.hat(t,s%4===2?0.025:0.015);
      if(s===0&&bar%2===0)E.taiko(t,0.2);
      if(s===10)E.taiko(t,0.12,120);
      if(bar%8===7&&s>=12)E.taiko(t,0.14,[140,125,110,95][s-12]);
    }
    if(lvl>=3){
      _melAt(E,this.mel,bar,s,t,(m,tt,d)=>E.lead(m+12,tt,d,0.018,{duty:0.125,dest:E.pan(-0.4)}));
      if(s===0)E.bell(_tone(ch,6,0),t,0.6,0.02);
      if(bar%8===0&&s===0)E.crash(t,0.035);
    }
  }
},
// ── Sudden Death: "Swatter Showdown" — D in-scale (Japanese minor), 156 BPM ──
// Heavy taiko, distorted bass riff, flute + lead trading the theme L/R.
sd:{
  bpm:156,
  bars:['Dm','Dm','Eb','A'],
  riff:[0,null,0,12,null,0,3,null,0,null,0,12,null,7,5,3],
  mel:_parseMel([
    'D5 . Eb5 . D5 . A4 . Bb4 . A4 . G4 . A4 .',
    'D5 . Eb5 . G5 . Eb5 . D5 . . . - - A4 .',
    'Eb5 . G5 . Bb5 . G5 . Eb5 . D5 . C5 . D5 .',
    'A4 . . . C#5 . . . E5 . . . A5 . G5 .']),
  tick(E,step,t){
    const bar=Math.floor(step/16),s=step%16,ch=this.bars[bar%4],S=E.stepSec;
    const lvl=Math.min(2,Math.floor(step/64));
    const off=this.riff[s];
    if(off!==null)E.distBass(_root(ch,2)+off,t,0.8*S,0.15);
    // taiko pattern: big hits + rolling 16ths building into each bar
    if(s===0||s===6||s===8)E.taiko(t,0.3,s===6?110:90);
    if(s===4||s===12)E.snare(t,0.1);
    if(s===14||s===15)E.taiko(t,0.14,130);
    if(s%2===0)E.hat(t,0.025);else if(lvl>=1)E.hat(t,0.012);
    if(s===3||s===11)E.clack(t,0.05,1300);
    if(s===0)E.pad(_voicing(ch,3),t,16*S,0.05,{lp:700});
    if(bar%4===0&&s===0)E.crash(t,0.045);
    if(bar%4===3&&s===8)E.swell(t,8*S,0.05);
    // theme: flute on the left, pulse lead echoes on the right
    _melAt(E,this.mel,bar,s,t,(m,tt,d)=>E.flute(m,tt,Math.max(d,0.12),0.065,{dest:E.pan(-0.45)}));
    if(lvl>=1)_melAt(E,this.mel,bar,s,t,(m,tt,d)=>E.lead(m-12,tt,d,0.03,{duty:0.5,lp:1800,dest:E.pan(0.45)}));
    if(lvl>=2&&(s===2||s===10))E.kick(t,0.18);
  }
},
// ── Victory: "Champion of the Grove" — D major fanfare, 126 BPM ─────────────
victory:{
  bpm:126,
  bars:['D','G','Bm','A'],
  mel:_parseMel([
    'D5 . D5 E5 F#5 . A5 . . . . . F#5 . A5 .',
    'B5 . . . A5 . G5 . A5 . . . . . - -',
    'F#5 . F#5 E5 D5 . F#5 . B5 . . . A5 . F#5 .',
    'E5 . . . F#5 . E5 . D5 . . . - - - -']),
  tick(E,step,t){
    const bar=Math.floor(step/16),s=step%16,ch=this.bars[bar%4],S=E.stepSec;
    if(s%4===0)E.bass(_root(ch,2)+(s===8?7:0),t,1.6*S,0.13);
    if(s===0||s===8)E.taiko(t,0.25);
    if([4,12,13,14].includes(s))E.snare(t,s===4||s===12?0.08:0.045);
    if(s%2===0)E.hat(t,0.018);
    if(s===0&&bar%4===0)E.crash(t,0.05);
    if(s===0||s===8)E.pad(_voicing(ch,4),t,(s===0?7:6)*S,0.05,{lp:1500});
    _melAt(E,this.mel,bar,s,t,(m,tt,d)=>E.brass(m,tt,d,0.05));
    if(s%2===1)E.bell(_tone(ch,6,(s-1)/2),t,0.3,0.012);
  }
}
};

// ── Player (look-ahead scheduler) ────────────────────────────────────────────
const _MP={synth:null,trackId:null,track:null,step:0,next:0,timer:null};
function _engine(track){const E=Object.create(_MP.synth);E.stepSec=60/track.bpm/4;return E;}
function _mschedule(){
  const tr=_MP.track;if(!tr)return;
  const ac=actx(),E=_engine(tr);
  while(_MP.next<ac.currentTime+0.12){
    try{tr.tick(E,_MP.step,_MP.next);}catch(e){console.error(e);}
    _MP.step++;_MP.next+=E.stepSec;
  }
  _MP.timer=setTimeout(_mschedule,25);
}
function _playTrack(id){
  const ac=actx();
  if(!_MP.synth)_MP.synth=new Synth(ac,musicOut());
  if(_MP.trackId===id&&_MP.timer)return; // already playing
  if(_MP.timer){clearTimeout(_MP.timer);_MP.timer=null;}
  // short fade-in so switching tracks isn't a hard cut
  const now=ac.currentTime,target=_muted?0:MUSIC_VOL;
  _musicBus.gain.cancelScheduledValues(now);_musicBus.gain.setValueAtTime(0,now);_musicBus.gain.linearRampToValueAtTime(target,now+0.15);
  _MP.trackId=id;_MP.track=BAMBOO_TRACKS[id];_MP.step=0;_MP.next=now+0.1;
  _mschedule();
}
function stopMusic(){
  if(_MP.timer){clearTimeout(_MP.timer);_MP.timer=null;}
  _MP.track=null;_MP.trackId=null;
}
function playGameMusic(){_playTrack('game');}
function playSuddenDeathMusic(){_playTrack('sd');}
function playVictoryMusic(){_playTrack('victory');}
function toggleMuteMusic(){
  _muted=!_muted;
  if(_musicBus)_musicBus.gain.setTargetAtTime(_muted?0:MUSIC_VOL,actx().currentTime,0.1);
  const b=document.getElementById('music-btn');if(b)b.textContent=_muted?'🔇':'🎵';
}

// ══════════════════════════════════════════════════════════════════════════════
// SFX — short, soft, bamboo-flavoured. All through the SFX bus (never direct
// to the speakers), so they sit on top of the music without blasting.
// ══════════════════════════════════════════════════════════════════════════════
let _sfxSynth=null;
function _sfx(){const ac=actx();if(!_sfxSynth)_sfxSynth=new Synth(ac,sfxOut());return _sfxSynth;}
const SFX={
  // card clicked — a quick bamboo "thwap"
  swat(){const S=_sfx(),t=S.ctx.currentTime;
    S.noise({t,dur:0.07,vol:0.35,ft:'bandpass',ff:1400,q:1.2});
    S.voice({f:170,t,dur:0.1,vol:0.35,type:'sine',slideTo:70,slideDur:0.08,a:0.001});
    S.clack(t+0.005,0.18,900);},
  // shuffle — soft bamboo rattle
  shuffle(){const S=_sfx(),t=S.ctx.currentTime;
    [0,0.05,0.1,0.15].forEach((d,i)=>S.clack(t+d,0.09,1000+i*180));},
  // point — two-note koto chime, up
  point(){const S=_sfx(),t=S.ctx.currentTime;
    S.koto('A5',t,0.25,0.17);S.koto('D6',t+0.07,0.35,0.17);S.bell('D6',t+0.07,0.4,0.07);},
  // minus — soft two-note down
  minus(){const S=_sfx(),t=S.ctx.currentTime;
    S.koto('E5',t,0.2,0.14);S.koto('B4',t+0.08,0.3,0.14);},
  // sudden death — taiko double-hit + low swell
  suddenDeath(){const S=_sfx(),t=S.ctx.currentTime;
    S.taiko(t,0.45,80);S.taiko(t+0.18,0.4,70);
    S.voice({f:_hz('D2'),t,dur:0.9,vol:0.12,type:'sawtooth',a:0.05,lp:500,lpTo:200});},
  // victory — little sparkle on top (the victory track carries the fanfare)
  victory(){const S=_sfx(),t=S.ctx.currentTime;
    ['D6','F#6','A6','D7'].forEach((n,i)=>S.bell(n,t+i*0.06,0.5,0.05));},
  // splash dismiss — clack + chime
  splashDismiss(){const S=_sfx(),t=S.ctx.currentTime;
    S.clack(t,0.15,1100);S.bell('A5',t+0.04,0.5,0.06);},
};


applyTeamColors();
updateBar();
fitScoreNames();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitScoreNames);
shuffle();



function dismissSplash() {
  try { SFX.splashDismiss(); } catch(e) {}
  try { playGameMusic(); } catch(e) {}
  const s = document.getElementById('splash');
  s.style.cssText += ';opacity:0;pointer-events:none;transition:opacity 0.5s ease;';
  setTimeout(() => s.remove(), 520);
}






</script>

  <div class="victory-bg" id="victory-bg"></div>
  <div class="victory-content">
    <div class="victory-label" id="victory-label">winner</div>
    <div class="victory-name" id="victory-name">TEAM A</div>
    <div class="victory-sub" id="victory-sub">WINS!</div>
    <div class="victory-scores" id="victory-scores">10 – 7</div>
    <div class="victory-tap">tap anywhere to play again</div>
  </div>
</div>
<div id="list-menu" onclick="event.stopPropagation()" style="display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);">
  <div style="background:#0d1117;border:1px solid rgba(82,183,136,0.4);border-radius:12px;padding:16px;min-width:240px;display:flex;flex-direction:column;gap:6px;">
    <button class="list-menu-item active" id="listBtn_basic"    onclick="setVocabList('basic')">📘 Basic (760)</button>
    <button class="list-menu-item"        id="listBtn_standard" onclick="setVocabList('standard')">📗 Standard (1000)</button>
    <button class="list-menu-item"        id="listBtn_yume"     onclick="setVocabList('yume')">🌸 Yume (750)</button>
  </div>
</div>
